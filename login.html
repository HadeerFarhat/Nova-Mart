<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – NovaMart</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d9488'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='36' font-family='Arial' font-weight='bold' fill='white'%3EN%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0d9488">

  <link rel="stylesheet" href="css/common.css?v=31">
  <link rel="stylesheet" href="css/login.css?v=31">
</head>
<body>
  <div id="site-header"></div>

  <section class="section">
    <div class="container">
      <div class="auth-container">
        <div class="auth-brand" dir="ltr">
          <div class="logo-icon" style="margin:0 auto 12px;width:48px;height:48px;font-size:1.4rem;">N</div>
          <h2 id="authTitle" data-i18n="login_title">Sign In</h2>
          <p class="text-muted text-center" style="margin-bottom:20px;font-size:0.9rem" id="authSubtitle">Welcome back to NovaMart</p>
        </div>
        <form id="authForm" onsubmit="handleAuth(event)">
          <div class="form-group" id="nameGroup" style="display:none">
            <label data-i18n="name">Full Name</label>
            <input type="text" id="nameInput" placeholder="Your full name" autocomplete="name">
          </div>
          <div class="form-group">
            <label data-i18n="email">Email</label>
            <input type="email" id="emailInput" required placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="form-group">
            <label data-i18n="password">Password</label>
            <input type="password" id="passInput" required placeholder="••••••••" minlength="6" autocomplete="current-password">
          </div>
          <div class="form-group" id="confirmGroup" style="display:none">
            <label data-i18n="confirm_password">Confirm Password</label>
            <input type="password" id="confirmInput" placeholder="••••••••" minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="authSubmit" data-i18n="login">Login</button>
        </form>
        <div class="form-footer">
          <span id="authSwitchText" data-i18n="no_account">Don't have an account?</span>
          <a href="#" id="authSwitch" onclick="toggleAuthMode(event)" data-i18n="register">Register</a>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <div class="toast"></div>

  <script src="assets/products.js?v=31"></script>
  <script src="assets/en.js"></script>
  <script src="assets/ar.js"></script>
  <script src="js/common.js?v=31"></script>
  <script src="js/login.js?v=31"></script>
</body>
</html>
